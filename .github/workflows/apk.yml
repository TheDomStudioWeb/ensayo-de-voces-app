name: APK Ensayo de Voces

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25

      - name: Compilar APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk EnsayoDeVoces.apk

      - uses: actions/upload-artifact@v4
        with:
          name: EnsayoDeVoces.apk
          path: EnsayoDeVoces.apk

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Ensayo de Voces ${{ github.run_number }}
          make_latest: true
          files: EnsayoDeVoces.apk
          body: Descargá **EnsayoDeVoces.apk** desde el teléfono e instalala encima de la anterior.
